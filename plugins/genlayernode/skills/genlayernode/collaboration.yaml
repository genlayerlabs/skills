name: genlayernode
requires:
  - name: genlayer-cli
    purpose: "Qualified Phase 2 staking/account operations and operator proofs on the owner's machine"
  - name: genlayer-node-release
    purpose: "Approved binary, signed checksums, config, Compose, GenVM and monitoring assets"
  - name: bradbury-network-publication
    purpose: "Trusted protocol manifest and verified Phase 2 HTTP/WS endpoints"
  - name: rpc-operator
    purpose: "Validator RPC key provisioning and quota; confirm the assigned owner"
  - name: monitoring-operator
    purpose: "Optional telemetry destinations and credentials"
sequence:
  - "Read SKILL.md and bradbury-phase-2.md; identify authorization and target host."
  - "Run validations.yaml and check sharp-edges.yaml proactively."
  - "Follow staking-wizard-procedure.md when registration is required."
  - "Follow install-procedure.md or update-procedure.md."
  - "Run doctor and startup checks; follow monitoring-procedure.md if requested."
  - "Report actual verification and remaining external blockers."
