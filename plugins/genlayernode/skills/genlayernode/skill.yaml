name: genlayernode
kind: gate
version: "1.1.0"
description: "Install, upgrade and diagnose Bradbury Phase 2 validators using verified network identity and release artifacts."
severity: high
tags: [validator, node, installation, blockchain, genlayer, bradbury]
purpose: |
  Follow SKILL.md and bradbury-phase-2.md. Use the same manifest, configuration,
  release verification and operator-proof flow as the current validator setup guide.
  Never infer readiness from chain ID, a documentation example or a Docker image alone.
owns:
  - Validator installation and upgrades
  - Network and protocol-manifest preflight
  - Operator keystore setup
  - LLM and monitoring configuration
  - Health and sync verification
defaults:
  network: testnet-bradbury
  chain_id: 4221
  rpc_url: https://rpc.testnet-chain.genlayer.com
  explorer_url: https://scan.testnet-chain.genlayer.com
  websocket_url: wss://rpc-genlayer-chain-testnet-cfn8m3xc6l.t.conduit.xyz
  chain_genesis_hash: "0x17d89764d4f4f963158fc4c5e8f2cb670c2837740b35f37081c12860c3df97e4"
  consensus_contract_address: "0x3F71AE080BD6270A91dBcc7960d88797828538E0"
  consensus_genesis: 47930
  manifest_path: configs/node/protocol-manifest.json
  install_path: /opt/genlayer-node
  node_rpc_port: 9151
  node_ops_port: 9153
  webdriver_port: 4444
required_inputs:
  - host: "Local, SSH, GCP or AWS target and existing access method"
  - version: "Exact published release approved for Bradbury Phase 2; no automatic latest"
  - cli_version: "Qualified v0.40 CLI with the matching Phase 2 SDK"
  - validator_wallet_address: "Existing registration or successful wizard result"
  - operator_address: "Registered operator matching the imported keystore"
  - rpc_access: "Verified HTTP/WS access, with credentials provisioned privately"
  - llm_provider: "Provider choice; keys configured privately on host"
config_wizard:
  - id: location
    question: "Which host should run the node?"
    options: [local, ssh, gcp, aws, other-linux]
  - id: operation
    question: "Is this a fresh install, same-network upgrade, or network migration?"
    options: [install, upgrade, migration]
  - id: deployment
    question: "How should the process be supervised?"
    options: [systemd, docker-compose, manual]
  - id: validator
    question: "Does the validator already exist on Bradbury Phase 2?"
    options: [existing, create-with-authorized-stake]
  - id: monitoring
    question: "Enable telemetry with your supplied destination and credentials?"
    options: [skip, enable]
patterns:
  - id: network-preflight
    command: "node <skill-directory>/scripts/check-network.mjs"
    notes: "Set BRADBURY_RPC_URL privately for assigned endpoints. Resolve current contracts through AddressManager. Create a key at https://app.conduit.xyz/rpc-keys; set GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY in the node environment or Compose .env. Separately test WS with X-AccessKey."
  - id: genvm-setup
    command: "python3 ./opt/genvm/current/bin/setup.py"
    notes: "Python 3.10+, pip and venv; run in the final install directory."
  - id: doctor
    command: "./bin/genlayernode doctor"
    notes: "Use actual config, manifest and exported environment. Do not bypass manifest validation."
  - id: binary-run
    command: './bin/genlayernode run -c "$(pwd)/configs/node/config.yaml"'
    notes: "GENLAYERNODE_PASSWORD is provided privately through the environment."
  - id: compose-doctor
    command: "docker compose --profile node run --rm --entrypoint /app/bin/genlayernode genlayer-node doctor"
  - id: compose-run
    command: "docker compose --profile node up -d"
    notes: "Pin NODE_VERSION; NODE_PASSWORD maps to GENLAYERNODE_PASSWORD. uid 10001 owns the new data directory."
  - id: staking
    command: "genlayer staking wizard --network testnet-bradbury"
    notes: "Qualified CLI only; operator proof required; read on-chain minimum, obtain transaction authorization."
anti_patterns:
  - Accepting chain ID 4221 without checking genesis and deployed contracts
  - Using an unpublished release or generic latest without qualification
  - Reusing old-network state or a manifest generated from an untrusted RPC
  - Running old and new nodes with the same operator key simultaneously
  - Printing secrets, authenticated URLs or headers, including partial values
  - Putting passwords in command-line arguments or service ExecStart
  - Assuming anonymous HTTP implies authenticated WS access
  - Claiming registration or healthy process proves active consensus participation
  - Redeploying consensus or changing epoch timing during node setup
procedure:
  - phase: scope
    action: "Explain steps; identify host, authorization, release and operation."
  - phase: preflight
    action: "Read bradbury-phase-2.md; run validations and proactively check sharp-edges.yaml."
  - phase: staking
    action: "Follow staking-wizard-procedure.md or inspect existing registration."
  - phase: install-or-upgrade
    action: "Follow install-procedure.md or update-procedure.md with signed release verification."
  - phase: configure
    action: "Use release config schema, trusted manifest, correct addresses, private keys and LLM configuration."
  - phase: doctor
    action: "Start WebDriver; run doctor with the node's actual config and environment. Stop on failed checks."
  - phase: start
    action: "Start using the authorized supervision method; verify health, sync, identity and logs."
  - phase: monitoring
    action: "If requested, follow monitoring-procedure.md and verify telemetry receipt."
  - phase: report
    action: "Report exact versions, executed checks and remaining publication/access prerequisites."
