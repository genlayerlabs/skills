validations:
  - id: architecture
    type: command
    command: "test \"$(uname -m)\" = x86_64 && test \"$(uname -s)\" = Linux"
    expect: exit 0
    message: "The validator binary requires AMD64 Linux."
  - id: python-version
    type: command
    command: "python3 -c 'import sys; assert sys.version_info >= (3, 10)'"
    expect: exit 0
    message: "Python 3.10+ is required for GenVM setup."
  - id: python-tools
    type: command
    command: "python3 -m pip --version && python3 -m venv --help >/dev/null"
    expect: exit 0
    message: "Install pip and venv for the selected python3."
  - id: docker-compose
    type: command
    command: "docker compose version"
    expect: exit 0
    message: "Docker and the Compose plugin are required."
  - id: host-capacity
    type: manual
    expect: "At least 16 GB RAM, 8 CPU cores and 128 GB SSD/NVMe"
    message: "Check available capacity on the actual target host."
  - id: bradbury-network
    type: command
    command: "node <skill-directory>/scripts/check-network.mjs"
    expect: exit 0
    message: "Require chain ID, pinned genesis and deployed Phase 2 contracts."
  - id: websocket-access
    type: manual
    expect: "Authenticated handshake, matching chain/genesis, subscription and unsubscription succeed"
    message: "HTTP 401 requires the assigned RPC key; do not log headers or credentials."
  - id: release-verified
    type: manual
    expect: "Approved release tarball and signed checksums exist; cosign and tarball SHA256 verification pass"
    message: "A changelog entry or image tag is not proof of a published binary."
  - id: protocol-manifest
    type: manual
    expect: "Trusted manifest matches chain 4221 and AddressManager 0x3F71AE080BD6270A91dBcc7960d88797828538E0"
    message: "Set consensus.manifestpath and preserve the trusted publication provenance."
  - id: secrets-provisioned
    type: manual
    expect: "Node password, required RPC key and enabled LLM keys are present privately"
    message: "Report configured/not configured only. Binary uses GENLAYERNODE_PASSWORD; Compose uses NODE_PASSWORD."
  - id: operator-registration
    type: manual
    expect: "Imported operator public address matches the registered Phase 2 validator wallet"
    message: "Owner key stays off-server; operator needs GEN on the new L2."
  - id: doctor
    type: command
    command: "./bin/genlayernode doctor"
    expect: exit 0
    message: "Run from the final installation with actual config, trusted manifest and exported secrets."
  - id: node-health
    type: command
    command: "curl -fsS http://localhost:9153/health"
    expect: "Healthy required checks; inspect body, not only HTTP status"
    message: "Check sync and validator identity separately from active-set membership."
  - id: monitoring-delivery
    type: manual
    expect: "When enabled, metrics and logs arrive in the operator-selected tenant"
    message: "A running Alloy container alone is not a delivery check."
