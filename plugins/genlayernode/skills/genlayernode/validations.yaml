validations:
  # ============================================================================
  # SYSTEM REQUIREMENTS
  # ============================================================================

  - id: architecture-amd64
    type: command
    command: "uname -m | grep -E '^(x86_64|amd64)$' >/dev/null"
    expect: "exit 0"
    message: "Only AMD64 Linux is supported. ARM64 (including Apple Silicon) is not supported."

  - id: ram-sufficient
    type: command
    command: "[ $(free -g | awk '/Mem:/ {print $2}') -ge 15 ]"
    expect: "exit 0"
    message: "At least 16GB RAM is required. Current system has insufficient memory."

  - id: disk-sufficient
    type: command
    command: "[ $(df -BG . | awk 'NR==2 {print $4}' | tr -d 'G') -ge 100 ]"
    expect: "exit 0"
    message: "At least 100GB free disk space is required."

  # ============================================================================
  # SOFTWARE PREREQUISITES
  # ============================================================================

  - id: nodejs-installed
    type: command
    command: "node --version 2>/dev/null | grep -E '^v(2[0-9]|[3-9][0-9])' >/dev/null"
    expect: "exit 0"
    message: "Node.js v20+ is required on the machine that runs the GenLayer CLI (not on the node server). Install with: curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt install -y nodejs"

  - id: npm-installed
    type: command
    command: "command -v npm >/dev/null 2>&1"
    expect: "exit 0"
    message: "npm is required. Usually installed with Node.js."

  - id: docker-installed
    type: command
    command: "command -v docker >/dev/null 2>&1"
    expect: "exit 0"
    message: "Docker is required. Install with: curl -fsSL https://get.docker.com | sh"

  - id: docker-compose-installed
    type: command
    command: "docker compose version >/dev/null 2>&1"
    expect: "exit 0"
    message: "Docker Compose is required. Usually included with Docker."

  - id: python3-installed
    type: command
    command: "python3 -c 'import sys; sys.exit(sys.version_info < (3,10))' >/dev/null 2>&1"
    expect: "exit 0"
    message: "Python 3.10+ is required. Install with: sudo apt install python3 (Ubuntu 22.04+/Debian 12+)"

  - id: python3-pip-installed
    type: command
    command: "command -v pip3 >/dev/null 2>&1"
    expect: "exit 0"
    message: "pip3 is required. Install with: sudo apt install python3-pip"

  - id: python3-venv-installed
    type: command
    command: "python3 -c 'import venv, ensurepip' >/dev/null 2>&1"
    expect: "exit 0"
    message: "python3-venv is required. Install with: sudo apt install python3-venv"

  - id: wget-installed
    type: command
    command: "command -v wget >/dev/null 2>&1"
    expect: "exit 0"
    message: "wget is required. Install with: sudo apt install wget"

  - id: cosign-installed
    type: command
    command: "command -v cosign >/dev/null 2>&1"
    expect: "exit 0"
    message: "cosign is required to verify the release signature. Install with: curl -fsSLo /tmp/cosign.deb https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign_2.4.1_amd64.deb && sudo dpkg -i /tmp/cosign.deb"

  - id: jq-installed
    type: command
    command: "command -v jq >/dev/null 2>&1"
    expect: "exit 0"
    message: "jq is recommended. Install with: sudo apt install jq"

  # ============================================================================
  # GENLAYER CLI
  # ============================================================================

  - id: genlayer-cli-installed
    type: command
    command: "command -v genlayer >/dev/null 2>&1"
    expect: "exit 0"
    message: "GenLayer CLI not installed. Install the exact version for your network: npm install -g genlayer@<version from the release announcement>"

  # ============================================================================
  # DOCKER STATE
  # ============================================================================

  - id: docker-running
    type: command
    command: "docker info >/dev/null 2>&1"
    expect: "exit 0"
    message: "Docker daemon is not running. Start with: sudo systemctl start docker"

  - id: docker-no-sudo
    type: command
    command: "docker ps >/dev/null 2>&1"
    expect: "exit 0"
    message: "Cannot run Docker without sudo. Run: sudo usermod -aG docker $USER, then log out and back in."

  # ============================================================================
  # POST-INSTALLATION CHECKS
  # ============================================================================

  - id: config-file-exists
    type: command
    command: "[ -f configs/node/config.yaml ]"
    expect: "exit 0"
    message: "Configuration file not found. Create configs/node/config.yaml"

  - id: config-valid-yaml
    type: command
    command: "python3 -c 'import yaml; yaml.safe_load(open(\"configs/node/config.yaml\"))' 2>/dev/null"
    expect: "exit 0"
    message: "Configuration file has YAML syntax errors."

  - id: genvm-binaries-exist
    type: command
    command: R=$(sed -n 's/^ *root_dir:[[:space:]]*//p' configs/node/config.yaml) && [ -f "$R/bin/genvm-modules" ] && ls "$R"/executor/*/bin/genvm >/dev/null 2>&1
    expect: "exit 0"
    message: "GenVM binaries not found under genvm.root_dir (v0.6+: opt/genvm/<ver>). Run: python3 \"$R/bin/setup.py\" in the install directory"

  - id: protocol-manifest-present
    type: command
    command: "[ -f configs/node/protocol-manifest.json ]"
    expect: "exit 0"
    message: "Protocol manifest not found (required since v0.6). Download your network's manifest from its docs section to configs/node/protocol-manifest.json (Testnet Bradbury: https://docs.genlayer.com/validators/bradbury.protocol-manifest.json)"

  - id: llm-key-configured
    type: command
    command: "[ -n \"${HEURISTKEY:-}\" ] || [ -n \"${COMPUT3KEY:-}\" ] || [ -n \"${IOINTELLIGENCEKEY:-}\" ] || [ -n \"${OPENROUTERKEY:-}\" ]"
    expect: "exit 0"
    message: "No LLM API key configured. Set HEURISTKEY, COMPUT3KEY, IOINTELLIGENCEKEY, or OPENROUTERKEY"

  - id: webdriver-running
    type: command
    command: "docker ps | grep -q webdriver"
    expect: "exit 0"
    message: "WebDriver container not running. Start with: docker compose up -d"

  - id: node-health-ok
    type: command
    command: curl -sf http://localhost:9153/health | jq -e '.status == "healthy"' >/dev/null
    expect: "exit 0"
    message: "Node health check failed. Check if node is running."

  # ============================================================================
  # SYSTEMD SERVICE CHECKS
  # ============================================================================

  - id: systemd-service-exists
    type: command
    command: "[ -f /etc/systemd/system/genlayer-node.service ]"
    expect: "exit 0"
    message: "Systemd service not installed. Create service file in /etc/systemd/system/"

  - id: systemd-service-enabled
    type: command
    command: "systemctl is-enabled genlayer-node >/dev/null 2>&1"
    expect: "exit 0"
    message: "Service not enabled. Run: sudo systemctl enable genlayer-node"

  - id: systemd-service-active
    type: command
    command: "systemctl is-active genlayer-node >/dev/null 2>&1"
    expect: "exit 0"
    message: "Service not running. Run: sudo systemctl start genlayer-node"

  # ============================================================================
  # WEBDRIVER HEALTH CHECKS
  # ============================================================================

  - id: webdriver-healthy
    type: command
    command: "docker inspect --format='{{.State.Health.Status}}' genlayer-node-webdriver 2>/dev/null | grep -q 'healthy'"
    expect: "exit 0"
    message: "WebDriver not healthy. Check: docker logs genlayer-node-webdriver"

  # ============================================================================
  # ENVIRONMENT FILE CHECKS
  # ============================================================================

  - id: env-file-exists
    type: command
    command: "[ -f /opt/genlayer-node/.env ] || [ -f .env ]"
    expect: "exit 0"
    message: ".env file not found. Create from template."

  - id: rpc-url-configured
    type: command
    command: grep -Eq '^  genlayerchainrpcurl:[[:space:]]*"https://' /opt/genlayer-node/configs/node/config.yaml
    expect: "exit 0"
    message: "RPC URL not configured in config.yaml (rollup.genlayerchainrpcurl)"

  - id: rpc-key-configured
    type: command
    command: "sudo awk -F= '/^GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY=/{f=length($2)>0} END{exit !f}' /opt/genlayer-node/.env"
    expect: "exit 0"
    message: "GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY (RPC provider API key) is not set in .env: when the provider needs one (Testnet Bradbury: Conduit), the WebSocket refuses the connection and the node does not start"

  - id: validator-address-configured
    type: command
    command: grep -Eq '^  mode:[[:space:]]*"full"' /opt/genlayer-node/configs/node/config.yaml || grep -Eq '^  validatorWalletAddress:[[:space:]]*"0x[0-9a-fA-F]{40}"' /opt/genlayer-node/configs/node/config.yaml
    expect: "exit 0"
    message: "Validator address not configured in config.yaml (node.validatorWalletAddress; not needed for a full node)"

  - id: rpc-url-reachable
    type: command
    command: U=$(sed -n 's/^  genlayerchainrpcurl:[[:space:]]*"\([^"]*\)".*/\1/p' /opt/genlayer-node/configs/node/config.yaml); [ -n "$U" ] || exit 1; curl -sf -m 30 -X POST "$U" -H Content-Type:application/json -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' | grep -q '"result":"0x' 
    expect: "exit 0"
    message: "Cannot reach the configured rollup RPC endpoint. Check network connectivity."

  - id: configured-rpc-chainid-reachable
    type: command
    command: U=$(sed -n 's/^  genlayerchainrpcurl:[[:space:]]*"\([^"]*\)".*/\1/p' /opt/genlayer-node/configs/node/config.yaml); [ -n "$U" ] || exit 1; curl -sf -m 10 -X POST "$U" -H Content-Type:application/json -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '"result":"0x' 
    expect: "exit 0"
    message: "Configured rollup RPC did not answer eth_chainId. This may be a shared RPC outage; verify before changing node config."

  - id: health-not-temporarily-banned
    type: command
    command: "curl -sf http://localhost:9153/health | grep -vi 'validator is banned' >/dev/null"
    expect: "exit 0"
    message: "Health endpoint reports a temporary validator ban. Fix the root cause, run doctor, then request unban with the validator wallet address only."

  # ============================================================================
  # ALLOY TELEMETRY CHECKS
  # ============================================================================

  - id: alloy-container-running
    type: command
    command: "docker ps | grep -q genlayer-node-alloy"
    expect: "exit 0"
    message: "Alloy telemetry container not running. Start with: docker compose --profile monitoring up -d"

  - id: alloy-bind-mount-fresh
    type: command
    command: |
      # Compare host and container log timestamps
      # If they differ by more than 5 minutes, bind mount is stale
      HOST_TIME=$(stat -c %Y /opt/genlayer-node/data/node/logs/node.log 2>/dev/null || echo 0)
      CONTAINER_TIME=$(docker exec genlayer-node-alloy stat -c %Y /var/log/genlayer/node.log 2>/dev/null || echo 0)
      DIFF=$((HOST_TIME - CONTAINER_TIME))
      [ ${DIFF#-} -lt 300 ]  # Difference less than 5 minutes
    expect: "exit 0"
    message: |
      Alloy bind mount is stale - container sees old log files.
      This means telemetry is NOT being sent to Grafana.
      Fix: docker restart genlayer-node-alloy
      See sharp-edges.yaml -> alloy-stale-bind-mount

  - id: alloy-logs-no-errors
    type: command
    command: "! docker logs genlayer-node-alloy 2>&1 | tail -50 | grep -q '401\\|403\\|error'"
    expect: "exit 0"
    message: "Alloy has authentication or other errors. Check: docker logs genlayer-node-alloy"

  - id: systemd-has-alloy-restart
    type: command
    command: "grep -q 'genlayer-node-alloy' /etc/systemd/system/genlayer-node.service 2>/dev/null"
    expect: "exit 0"
    message: |
      Systemd service missing ExecStartPost for Alloy restart.
      Add this line after ExecStart in /etc/systemd/system/genlayer-node.service:
      ExecStartPost=-+/bin/sh -c 'sleep 5 && /usr/bin/docker restart genlayer-node-alloy >/dev/null 2>&1 || true'
      Then run: sudo systemctl daemon-reload

# Validations that must pass before installation
on_stop:
  - architecture-amd64
  - docker-installed
  - docker-running
  - python3-installed
  - python3-venv-installed
  - cosign-installed

# Validations that are warnings
on_warn:
  - ram-sufficient
  - disk-sufficient
  - jq-installed
  - docker-no-sudo
  - python3-pip-installed
  - systemd-has-alloy-restart

# Post-update validations (run after upgrade)
post_update:
  - node-health-ok
  - alloy-container-running
  - alloy-bind-mount-fresh
  - alloy-logs-no-errors
