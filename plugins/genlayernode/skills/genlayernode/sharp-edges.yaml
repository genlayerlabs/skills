# Sharp edges for genlayernode
#
# CRITICAL: These edge cases MUST be actively checked during skill execution,
# not just used for reactive diagnosis after failures.
#
# HOW TO USE THIS FILE:
# 1. BEFORE each major phase, review relevant edges
# 2. PROACTIVELY check for edge case conditions
# 3. FIX or WARN before proceeding
# 4. Document when each edge was checked
#
# Example: Before starting update, explicitly check:
#   - Is LLM provider key set but provider disabled? -> Fix before switching
#   - Is database structure incorrect? -> Fix before switching
#   - Is GenVM setup complete? -> Verify before switching
#
# BAD: Wait for node to fail, then search edges for diagnosis
# GOOD: Check edges before each step, prevent failures
#
# See pre-update-checklist.md for structured validation approach.

edges:
  # ============================================================================
  # PREREQUISITES
  # ============================================================================

  - id: wrong-architecture
    description: "Arch mismatch between host and the binary/Docker image (amd64 vs arm64)"
    detect: |
      uname -m
      # x86_64  == amd64  (most Linux servers, Intel/AMD)  -> use linux-amd64 tarball / *-amd64 image
      # aarch64 == arm64  (AWS Graviton, Apple Silicon)    -> use linux-arm64 tarball / *-arm64 image
      # For a Docker image, confirm it matches the host:
      docker image inspect <image> --format 'Arch: {{.Architecture}} / OS: {{.Os}}'
    impact: "Binaries won't execute (Exec format error); an arm64 image on x86_64 only runs under slow QEMU emulation (bad for a node)."
    fix: |
      NAMING (commonly confused): amd64 = x86-64 = standard Linux servers (NOT mac-specific);
      arm64 = aarch64 = AWS Graviton and Apple-Silicon Macs. Pick the artifact/image tag that
      MATCHES `uname -m`:
        - x86_64 host  -> genlayer-node-linux-amd64 tarball / ...:<ver>-amd64 image
        - aarch64 host -> genlayer-node-linux-arm64 tarball / ...:<ver>-arm64 image
      If a repo has both -amd64 and -arm64 tags, do not assume the untagged/`latest` tag is amd64.
    severity: critical

  - id: insufficient-ram
    description: "Server has less than 16GB RAM"
    detect: |
      free -g | grep Mem | awk '{print $2}'
      # Should be >= 16
    impact: "Node may crash under load or during contract execution."
    fix: |
      Upgrade to a server with at least 16GB RAM.
      Recommended: 32GB for production validators.
    severity: high

  - id: nodejs-not-installed
    description: "Node.js is not installed or version too old"
    detect: |
      node --version
      # Should be v20 or higher
    impact: "Cannot install genlayer CLI."
    fix: |
      Install Node.js 18+:
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt install -y nodejs
    severity: critical

  - id: docker-not-installed
    description: "Docker or Docker Compose not installed"
    detect: |
      docker --version
      docker compose version
    impact: "Cannot run WebDriver or Docker-based deployment."
    fix: |
      Install Docker:
      curl -fsSL https://get.docker.com | sh
      sudo usermod -aG docker $USER
      # Log out and back in
    severity: critical

  # ============================================================================
  # WALLET AND STAKING
  # ============================================================================

  - id: insufficient-gen-balance
    description: "Wallet has less than the live self-stake minimum for staking"
    detect: |
      genlayer staking balance --address YOUR_ADDRESS
    impact: "Cannot create validator. Staking wizard will fail."
    fix: |
      Acquire at least the live self-stake minimum tokens:
      - Purchase on supported exchanges
      - Transfer from another wallet
      - Use testnet faucet (for testnet only)
    severity: critical

  - id: keystore-export-forgotten
    description: "Didn't export operator keystore during wizard"
    detect: |
      ls /path/to/operator-keystore.json
    impact: "Cannot import operator key to node."
    fix: |
      Re-run parts of the wizard or use the account new command
      to generate a new operator key, then update the operator
      address in your validator settings.
    severity: high

  - id: wrong-network-selected
    description: "Selected wrong network in staking wizard"
    detect: |
      Check the RPC URL in your config matches the network
      you selected during wallet creation.
    impact: "Validator won't be recognized on the correct network."
    fix: |
      Re-run staking wizard with correct network selection
      or manually update configuration to match.
    severity: critical

  # ============================================================================
  # DOWNLOAD AND EXTRACTION
  # ============================================================================

  - id: download-failed
    description: "Node binary download failed"
    detect: |
      ls genlayer-node-linux-amd64-*.tar.gz
      # Check file size is reasonable (>50MB)
    impact: "Cannot proceed with installation."
    fix: |
      Check network connectivity:
      curl -I https://storage.googleapis.com

      Retry download or use alternative mirror.
    severity: high

  - id: extraction-failed
    description: "Tar extraction failed or incomplete"
    detect: |
      ls -la ${VERSION}/bin/genlayernode
      ls -la ${VERSION}/opt/genvm/current/bin/
    impact: "Missing binaries, node won't start."
    fix: |
      Re-download and extract:
      rm -rf ${VERSION}
      tar -xzvf genlayer-node-linux-amd64-${VERSION}.tar.gz -C ./${VERSION}
    severity: high

  - id: setup-py-failed
    description: "GenVM dependencies not installed in their final location"
    detect: |
      test -x opt/genvm/current/bin/genvm-modules
      test -f opt/genvm/current/bin/setup.py
    impact: "GenVM cannot execute contracts or validate runner installations."
    fix: |
      Complete host-prerequisites.md: Python 3.10+, pip, venv and libstdc++6.
      From the final release directory run:
      python3 ./opt/genvm/current/bin/setup.py
      Require all runner hash checks and precompilation to finish successfully.
    severity: critical

  - id: genvm-macos-executor-in-linux-tarball
    description: "Wrong-OS executor or invalid release package"
    detect: |
      file opt/genvm/current/executor/*/bin/genvm
      # Linux AMD64 requires ELF x86-64, not Mach-O.
    impact: "Executor cannot start on the target host."
    fix: |
      Check architecture, exact release, signed tarball and final installation
      path. Re-run the release setup script and its hash/install checks. If the
      verified package still contains the wrong executable, report the package
      defect; do not mix executors from unrelated releases or delete live state.
    severity: critical

  - id: v06-genvm-opt-layout-and-opt-symlink
    description: "v0.6+ ships genvm under opt/genvm/<ver> (under opt/) and needs an `opt` symlink"
    detect: |
      ls -d opt/genvm/*/ 2>/dev/null          # v0.6+ layout present
      readlink opt/genvm/current            # packaged version link
      # If config.yaml has genvm.root_dir: ./opt/genvm/<ver> but /opt/genlayer-node/opt is missing,
      # doctor reports: 'genvm-modules: not found at opt/genvm/<ver>/bin/genvm-modules'
    impact: |
      The node/doctor resolve genvm at ./opt/genvm/<ver> RELATIVE to /opt/genlayer-node.
      Without an `opt` symlink (alongside bin/, configs/, data/), the GenVM binaries and
      module configs are 'not found' and config validation fails.
    fix: |
      Create the `opt` symlink in addition to the usual ones:
        ln -sfn <version>/opt /opt/genlayer-node/opt
      (The package provides opt/genvm/current; run setup in the final release directory.)
    severity: high

  # ============================================================================
  # CONFIGURATION
  # ============================================================================

  - id: invalid-yaml
    description: "config.yaml has syntax errors"
    detect: |
      python3 -c "import yaml; yaml.safe_load(open('configs/node/config.yaml'))"
    impact: "Node will fail to start with config parse error."
    fix: |
      Validate YAML syntax:
      - Check indentation (use spaces, not tabs)
      - Ensure colons have space after them
      - Quote strings with special characters
    severity: high

  - id: wrong-contract-addresses
    description: "Wrong Phase 2 registry, genesis or trusted manifest"
    detect: |
      node <skill-directory>/scripts/check-network.mjs
      # Separately run doctor with the trusted Phase 2 manifest.
    impact: "Chain ID 4221 alone cannot distinguish old Bradbury from Phase 2."
    fix: |
      Follow bradbury-phase-2.md. consensusaddress is AddressManager
      0x3F71AE080BD6270A91dBcc7960d88797828538E0; consensus.genesis is 47930.
      Set consensus.chainid to 4221 and consensus.manifestpath to the trusted
      manifest. Resolve Staking and ConsensusMain via getAddress(string), never
      pin their initial addresses as permanent identity or trust an RPC-generated manifest.
    severity: critical

  - id: rpc-url-unreachable
    description: "RPC or WebSocket URL is not accessible"
    detect: |
      curl -X POST ${RPC_URL} -H "Content-Type: application/json" \
        -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
    impact: "Node cannot sync with the network."
    fix: |
      Verify RPC URL is correct and accessible:
      1. Check URL spelling
      2. Verify network connectivity
      3. Check if provider is operational
    severity: critical

  - id: shared-rpc-outage
    description: "Configured rollup RPC or WebSocket endpoint is experiencing a shared outage"
    detect: |
      # HTTP RPC smoke tests against the configured endpoint
      source /opt/genlayer-node/.env 2>/dev/null || source .env
      curl -sS -m 10 -X POST "$GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCURL" \
        -H "Content-Type: application/json" \
        -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'
      curl -sS -m 10 -X POST "$GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCURL" \
        -H "Content-Type: application/json" \
        -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":2}'

      # Node logs often show: dependencies: get chain ID: 504 Gateway Timeout
      journalctl -u genlayer-node --since "30 min ago" --no-pager | \
        grep -Ei "get chain ID|Gateway Timeout|504|websocket|rollup"
    impact: |
      Node cannot bootstrap or sync even when local configuration is correct.
      Multiple validators may report the same failure at the same time.
    fix: |
      1. Treat as network/provider incident first; do not assume local config drift.
      2. Verify the configured HTTP RPC and WebSocket endpoints independently.
      3. Check community/operator channels or official status for a shared incident.
      4. Use an officially provided replacement endpoint if one exists.
      5. If no replacement exists, avoid repeated restart loops and keep sanitized
         diagnostics ready: network, node version, GenVM version, health status,
         and redacted log lines.
    severity: high

  # ============================================================================
  # VALIDATION STATUS
  # ============================================================================

  - id: temporary-validator-ban
    description: "Health endpoint reports validator is temporarily banned"
    detect: |
      curl -s http://localhost:9153/health | jq .
      # Look for: temporary ban until epoch ...: validator is banned

      journalctl -u genlayer-node --since "1 hour ago" --no-pager | \
        grep -Ei "temporary ban|validator is banned|NO_PROVIDER_FOR_PROMPT|provider|llm|Gateway Timeout"
    impact: |
      The node can be running and connected while validation remains down until
      the temporary ban expires or an operator unbans it after the root cause is fixed.
    fix: |
      1. Fix the underlying cause first: LLM provider availability/capabilities,
         RPC outage, operator funding, or node version/config drift.
      2. Run `./bin/genlayernode doctor` and re-check `/health`.
      3. If requesting help, share only sanitized details: validator wallet address,
         network, node version, GenVM version, and health status. Do not paste
         API keys, private keys, passwords, or full `.env` contents.
      4. Ask for unban only after the node is healthy enough to avoid immediate re-ban.
    severity: high

  # ============================================================================
  # KEY IMPORT
  # ============================================================================

  - id: wrong-passphrase
    description: "Using wrong passphrase for keystore import"
    detect: |
      Error message: "could not decrypt key with given passphrase"
    impact: "Cannot import operator key."
    fix: |
      Use the exact passphrase set during wizard export.
      If forgotten, generate a new operator key and update
      your validator's operator address.
    severity: high

  - id: keystore-permissions
    description: "Keystore file has wrong permissions"
    detect: |
      ls -la /path/to/operator-keystore.json
      # Should be readable by current user
    impact: "Import command cannot read the file."
    fix: |
      Fix permissions:
      chmod 600 /path/to/operator-keystore.json
    severity: medium

  # ============================================================================
  # LLM CONFIGURATION
  # ============================================================================

  - id: no-llm-key-set
    description: "No LLM provider API key configured"
    detect: |
      env | grep -E "(HEURISTKEY|COMPUT3KEY|IOINTELLIGENCE_API_KEY)"
    impact: "Node cannot execute intelligent contracts."
    fix: |
      Set at least one LLM API key:
      export HEURISTKEY='your_key'

      Add to shell profile for persistence:
      echo "export HEURISTKEY='your_key'" >> ~/.bashrc
    severity: critical

  - id: llm-key-invalid
    description: "LLM API key is invalid or expired"
    detect: |
      Check LLM module logs for authentication errors.
    impact: "Contract executions fail with LLM errors."
    fix: |
      Verify API key in provider dashboard.
      Generate new key if needed.
    severity: high

  - id: llm-provider-not-enabled
    description: "LLM provider is configured in .env but not enabled in GenVM config"
    detect: |
      # PROACTIVE CHECK (before switching versions):
      # 1. Check which LLM key is set in .env
      # Print presence only, never key values.
      set -a; source /opt/genlayer-node/.env; set +a
      for key in HEURISTKEY COMPUT3KEY IOINTELLIGENCEKEY LIBERTAI_API_KEY ANTHROPICKEY GEMINIKEY OPENROUTERKEY MORPHEUS_API_KEY; do
        if [ -n "${!key:-}" ]; then printf '%s: configured\n' "$key"; fi
      done

      # 2. For each set key, check if that provider is enabled in GenVM config
      # Provider name mapping:
      #   HEURISTKEY -> heurist
      #   COMPUT3KEY -> comput3
      #   IOINTELLIGENCEKEY -> ionet
      #   LIBERTAI_API_KEY -> libertai
      #   ANTHROPICKEY -> anthropic
      #   GEMINIKEY -> google
      #   OPENROUTERKEY -> openrouter
      #   MORPHEUS_API_KEY -> morpheus
      grep -A 2 '<provider>:' opt/genvm/current/config/genvm-module-llm.yaml | grep 'enabled'

      # REACTIVE DETECTION (after node fails to bootstrap):
      # Node logs show: "failed to start module via manager error=\"starting module Llm: manager request failed: 500"
      journalctl -u genlayer-node | grep -i "module_failed_to_start\|starting module Llm"
    impact: |
      CRITICAL BOOTSTRAP FAILURE - NODE NEVER BECOMES OPERATIONAL

      This is NOT a runtime failure - this is a COMPLETE BOOTSTRAP FAILURE:
      - Node NEVER successfully starts
      - Lifecycle worker fails to initialize
      - Node enters crash loop (systemd keeps restarting it)
      - INFINITE DOWNTIME until manually fixed
      - Validator is 100% offline
      - NO validations, NO consensus participation, NO rewards
      - Health endpoint unreachable
      - RPC endpoints never become available

      Example timeline of failure:
      - 08:44:02: Node service started
      - 08:45:35: LLM module fails to start (attempt 3)
      - 08:47:00: Lifecycle worker failed to start
      - 08:47:00: Node crashed
      - 08:47:10: Systemd auto-restart -> Same failure cycle repeats

      NOTE: This issue can be caught by running `./bin/genlayernode doctor` before starting the node.

      IMPACT ON UPDATE:
      If this occurs during an update from working node:
      - Old version stopped (as planned)
      - New version FAILS to bootstrap (unexpected)
      - Result: Complete outage instead of a measured interruption
      - Validator misses ALL validations until manually fixed

      WHY THIS HAPPENS:
      Downloaded tarball includes GenVM config with some providers disabled by default.
      If your chosen provider is disabled, you MUST enable it manually after extraction.

      ENV VAR TO PROVIDER MAPPING:
      - HEURISTKEY -> heurist
      - COMPUT3KEY -> comput3
      - IOINTELLIGENCEKEY -> ionet
      - LIBERTAI_API_KEY -> libertai
      - ANTHROPICKEY -> anthropic
      - GEMINIKEY -> google
      - OPENROUTERKEY -> openrouter
      - MORPHEUS_API_KEY -> morpheus
    fix: |
      PROACTIVE FIX (during update preparation, BEFORE switching):
      ================================================================
      After extracting new version, BEFORE switching symlinks:

      # 1. Identify which provider is configured in .env
      # Print presence only, never key values.
      set -a; source /opt/genlayer-node/.env; set +a
      for key in HEURISTKEY COMPUT3KEY IOINTELLIGENCEKEY LIBERTAI_API_KEY ANTHROPICKEY GEMINIKEY OPENROUTERKEY MORPHEUS_API_KEY; do
        if [ -n "${!key:-}" ]; then printf '%s: configured\n' "$key"; fi
      done

      # 2. Enable the corresponding provider in GenVM config
      # Replace <provider> with the provider name (heurist, comput3, ionet, libertai, anthropic, google)
      sed -i '/^  <provider>:/,/^  [a-z]/ s/enabled: false/enabled: true/' \
        /opt/genlayer-node/${NEW_VERSION}/opt/genvm/current/config/genvm-module-llm.yaml

      # 3. Verify it's enabled
      grep -A 2 '<provider>:' /opt/genlayer-node/${NEW_VERSION}/opt/genvm/current/config/genvm-module-llm.yaml
      # Should show: enabled: true

      REACTIVE FIX (after node failed to bootstrap):
      ==============================================
      1. Stop the failing node:
         sudo systemctl stop genlayer-node

      2. Enable the provider in GenVM config:
         sed -i '/^  <provider>:/,/^  [a-z]/ s/enabled: false/enabled: true/' \
           /opt/genlayer-node/opt/genvm/current/config/genvm-module-llm.yaml

      3. Verify the change:
         grep -A 2 '<provider>:' /opt/genlayer-node/opt/genvm/current/config/genvm-module-llm.yaml
         # Should show: enabled: true

      4. Restart the node:
         sudo systemctl start genlayer-node

      5. Verify bootstrap succeeds:
         sudo journalctl -u genlayer-node -f --no-hostname
         # Should see: "genvm is ready"
         # Should NOT see: "module_failed_to_start"

      6. Verify node is operational:
         curl -s http://localhost:9153/health | jq '.status'
         # Should show: "up" or "down" (syncing) but NOT connection refused
    severity: critical
    when_to_check: |
      MANDATORY CHECKS:
      1. During update preparation (after extracting new version)
      2. After any version switch (verify bootstrap succeeds)
      3. When setting up new installation

      Always verify your LLM provider is enabled in GenVM config!

  # ============================================================================
  # RUNTIME
  # ============================================================================

  - id: port-already-in-use
    description: "Required ports (9151, 9153, 4444) already in use"
    detect: |
      lsof -i :9151
      lsof -i :9153
      lsof -i :4444
    impact: "Node or WebDriver cannot start."
    fix: |
      Kill conflicting processes:
      lsof -i :PORT
      kill -9 PID

      Or change ports in config.yaml.
    severity: high

  - id: webdriver-not-running
    description: "WebDriver container not started"
    detect: |
      docker ps | grep webdriver
      curl http://localhost:4444/status
    impact: "Web module cannot execute, contracts fail."
    fix: |
      Start WebDriver:
      docker compose up -d

      Check logs:
      docker logs genlayer-node-webdriver
    severity: high

  - id: node-not-syncing
    description: "Node started but not syncing blocks"
    detect: |
      curl -s http://localhost:9153/health | jq .status
      curl -s http://localhost:9153/metrics | grep synced
    impact: "Validator cannot participate in consensus."
    fix: |
      Check:
      1. RPC URL is correct and accessible
      2. Network has sufficient peers
      3. Firewall allows outbound connections

      Check logs for errors.
    severity: high

  - id: docker-env-not-sourced
    description: "Running docker compose without sourcing .env"
    detect: |
      # Check if running without environment variables
      docker compose config | grep NODE_VERSION
    impact: "Docker containers start with wrong or missing configuration."
    fix: |
      Always source .env before docker compose:
      source .env && docker compose --profile node up -d
    severity: high

  - id: screen-tmux-not-used
    description: "Running node in SSH session without screen/tmux"
    detect: |
      # Check if running in screen or tmux
      echo $STY $TMUX
    impact: "Node stops when SSH session disconnects."
    fix: |
      Use screen or tmux for persistent sessions:

      # Using screen
      screen -S genlayer
      ./bin/genlayernode run ...
      # Detach: Ctrl+A, D
      # Reattach: screen -r genlayer

      # Using tmux
      tmux new -s genlayer
      ./bin/genlayernode run ...
      # Detach: Ctrl+B, D
      # Reattach: tmux attach -t genlayer

      OR use systemd service (recommended for production):
      See create-systemd-service pattern.
    severity: high

  # ============================================================================
  # SYSTEMD SERVICE (from infrastructure patterns)
  # ============================================================================

  - id: systemd-service-not-enabled
    description: "Systemd service created but not enabled for auto-start"
    detect: |
      systemctl is-enabled genlayer-node
    impact: "Node won't start automatically after server reboot."
    fix: |
      Enable the service:
      sudo systemctl enable genlayer-node

      Then verify:
      sudo systemctl is-enabled genlayer-node
    severity: medium

  - id: env-file-not-sourced
    description: "Running node without environment file loaded"
    detect: |
      # Check if required env vars are set
      [ -z "$GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCURL" ] && echo "not set"
    impact: "Node fails to connect to rollup or consensus contracts."
    fix: |
      For manual runs, source the .env file first:
      source /opt/genlayer-node/.env
      ./bin/genlayernode run

      For systemd, ensure EnvironmentFile is set in service file.
    severity: high

  - id: wrong-llm-env-var-name
    description: "Using wrong environment variable name for LLM provider"
    detect: |
      # io.net uses IOINTELLIGENCEKEY (no underscore), not IOINTELLIGENCE_API_KEY
      env | grep -E "IOINTELLIGENCE"
    impact: "LLM module fails to authenticate."
    fix: |
      Correct environment variable names:
      - Heurist: HEURISTKEY
      - Comput3: COMPUT3KEY
      - io.net: IOINTELLIGENCEKEY (not IOINTELLIGENCE_API_KEY)
      - LibertAI: LIBERTAI_API_KEY
      - Anthropic: ANTHROPICKEY
      - Google: GEMINIKEY
      - OpenRouter: OPENROUTERKEY
      - Morpheus: MORPHEUS_API_KEY
    severity: high

  - id: data-directory-permissions
    description: "Data directory has wrong ownership"
    detect: |
      ls -la /opt/genlayer-node/data/
      # Should be owned by the user running the node
    impact: "Node cannot write to data directory, fails to start."
    fix: |
      Fix ownership:
      sudo chown -R $USER:$USER /opt/genlayer-node/data/

      Or for systemd service user:
      sudo chown -R ansible:ansible /opt/genlayer-node/data/
    severity: high

  - id: webdriver-not-healthy
    description: "WebDriver container running but not healthy"
    detect: |
      docker inspect --format='{{.State.Health.Status}}' genlayer-node-webdriver
      # Should return 'healthy'
    impact: "Web module cannot execute, contracts fail."
    fix: |
      Check WebDriver logs:
      docker logs genlayer-node-webdriver

      Restart if needed:
      docker compose down
      docker compose up -d

      Wait for healthy:
      until docker inspect --format='{{.State.Health.Status}}' genlayer-node-webdriver | grep -q 'healthy'; do sleep 2; done
    severity: high

  - id: missing-python-packages
    description: "Missing python3-pip or python3-venv packages"
    detect: |
      dpkg -l | grep -E "python3-pip|python3-venv"
    impact: "GenVM setup.py fails to install dependencies."
    fix: |
      Install required Python packages:
      sudo apt update
      sudo apt install -y python3 python3-pip python3-venv
    severity: high

  - id: new-operator-not-funded
    description: "Generated new operator key but didn't fund it"
    detect: |
      # Check operator balance is zero or very low
      # Node will fail to submit transactions
      journalctl -u genlayer-node | grep -i "insufficient funds"
    impact: "Node cannot submit transactions (activate, propose, vote). Validator will miss duties."
    fix: |
      1. Get operator address from node logs or keystore
      2. Send GEN to the operator address for gas fees
      3. Recommended minimum: an authorized GEN gas budget for initial operations

      To find operator address:
      cat /opt/genlayer-node/data/node/keystore/*/address

      Or check logs:
      journalctl -u genlayer-node | grep "operator"
    severity: critical

  - id: new-operator-not-registered
    description: "Generated new operator key but didn't update validator settings"
    detect: |
      # Check if operator address in config matches what's registered
      # Node will show unauthorized errors
      journalctl -u genlayer-node | grep -i "unauthorized\|not authorized\|operator mismatch"
    impact: "Node cannot act on behalf of validator. All transactions will be rejected."
    fix: |
      Update validator's operator address:

      Option 1: Using staking UI
      - Go to staking dashboard
      - Find your validator
      - Update operator address to the new one

      Option 2: Using genlayer CLI
      genlayer staking set-operator YOUR_VALIDATOR_ADDRESS NEW_OPERATOR_ADDRESS --operator-account LOCAL_OPERATOR_ACCOUNT --network testnet-bradbury
      # Only after explicit rotation authorization; the local key signs the new proof.
    severity: critical

  - id: consensus-genesis-not-set
    description: "Consensus deployment block missing or confused with chain genesis hash"
    detect: |
      grep -E "genesis|manifestpath|chainid" configs/node/config.yaml
    impact: "Startup can scan an inappropriate block range or reject protocol admission."
    fix: |
      Phase 2 uses consensus.genesis: 47930, chainid: "4221" and the approved
      consensus.manifestpath. This start block is different from the block-zero
      hash checked by scripts/check-network.mjs. Run doctor before restarting;
      measure sync progress instead of promising synchronization in seconds.
    severity: high

  - id: strip-components-extraction
    description: "Extracting tarball without --strip-components"
    detect: |
      # Check if node was extracted with nested directory
      ls /opt/genlayer-node/genlayer-node-*/
    impact: "Binaries at wrong path, commands fail."
    fix: |
      Use --strip-components=1 when extracting:
      sudo tar -xzvf genlayer-node.tar.gz -C /opt/genlayer-node --strip-components=1

      Or move files to correct location:
      sudo mv /opt/genlayer-node/genlayer-node-*/* /opt/genlayer-node/
    severity: medium

  - id: docker-db-symlink
    description: "Docker deploy fails with PebbleDB error because DB symlink points outside container mount"
    detect: |
      # Check if docker node is crash-looping with genlayer.db error
      docker logs genlayer-node 2>&1 | grep "genlayer.db"
      # Check if genlayer.db is a symlink (shouldn't be for docker deploys)
      ls -la /opt/genlayer-node/${VERSION}/data/node/genlayer.db
    impact: |
      Docker container cannot follow symlinks that point outside the mounted volume.
      The node will crash with "mkdir data/node/genlayer.db: file exists" or similar
      PebbleDB error because the symlink target is not accessible inside the container.
    fix: |
      Replace the symlink with a real directory:
        rm /opt/genlayer-node/${VERSION}/data/node/genlayer.db
        mkdir -p /opt/genlayer-node/${VERSION}/data/node/genlayer.db

      Then restart the container:
        docker compose --profile node up -d

      PREVENTION: When deploying as docker, skip the DB symlink creation step.
      The database should live directly in the version directory for docker deploys.
    severity: high

  - id: docker-webdriver-host-ssrf-address-forbidden
    description: "Docker deploy (v0.6+) crash-loops: genvm web module returns ADDRESS_FORBIDDEN reaching the webdriver"
    detect: |
      docker logs genlayer-node 2>&1 | grep -i "ADDRESS_FORBIDDEN"
      # Boot GenVM self-test renders a page via web module -> webdriver and fails:
      #   causes:["ADDRESS_FORBIDDEN"], url: http://webdriver-container:4444/render?...
      #   -> "test genvm: error running contract" -> "Failed to execute root command" -> exit -> restart loop
      grep webdriver_host genvm-module-web-docker.yaml   # default: http://webdriver-container:4444 (a HOSTNAME)
    impact: |
      genvm's web-module SSRF guard is a DNS-resolver hook that filters HOSTNAMES at
      resolution time (private/loopback ranges are rejected). The shipped
      genvm-module-web-docker.yaml points webdriver_host at the HOSTNAME 'webdriver-container',
      which resolves to a private docker IP -> blocked. Host/binary deploys are unaffected
      (they use the 127.0.0.1 LITERAL; a literal IP never enters DNS resolution, so the filter
      never runs). `always_allow_hosts` does NOT help (it only governs ports, not the resolver).
    fix: |
      Apply ONLY when the symptom is actually present (see detect) — do NOT pre-apply, and do
      NOT gate on a genvm version. A node/genvm release may already allow the configured
      webdriver_host, in which case ADDRESS_FORBIDDEN never appears and there is nothing to do.
      When you DO see it: point webdriver_host at the webdriver's CURRENT literal IP (a literal
      never enters DNS resolution, so the resolver filter never runs):
        IP=$(docker inspect genlayer-node-webdriver --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
        sed -i "s|^webdriver_host: .*|webdriver_host: http://$IP:4444|" genvm-module-web-docker.yaml
        docker restart genlayer-node
      That IP can change on `compose down`/`up` — re-check after recreation. Do NOT hardcode a
      compose subnet / static IP in the node's SHIPPED docker assets (trades one env-dependent
      failure for another).
    severity: critical
    when_to_check: |
      REACTIVE — only when the node crash-loops AND its logs show ADDRESS_FORBIDDEN. No version
      precondition; if the symptom is absent, do nothing.

  - id: doctor-command-syntax-v06
    description: "Obsolete doctor flags or unexported private environment"
    detect: |
      ./bin/genlayernode doctor --help
    impact: "doctor check and the former expected-consensus override are unsupported; missing exported keys break probes."
    fix: |
      cd /opt/genlayer-node
      set -a; source .env; set +a
      # GENLAYERNODE_PASSWORD and the RPC/LLM keys must be configured privately.
      # Require consensus.chainid and the trusted consensus.manifestpath.
      ./bin/genlayernode doctor
    severity: high

  - id: full-node-mode-vs-validator
    description: "Full node (mode: full) needs NO wallet/operator/keystore/staking"
    detect: |
      grep -E "^\s*mode:" configs/node/config.yaml   # 'full' or 'validator'
      docker logs genlayer-node 2>&1 | grep -i "full node mode detected"
    impact: |
      A full node syncs and serves RPC but does NOT participate in consensus, so it needs no
      validator wallet, operator address, keystore, staking, or gas funding (logs: 'full node
      mode detected, skipping validator setup'). It DOES still need an LLM provider + genvm
      config (for gen_call). Running the staking wizard / importing an operator keystore for a
      full node is wasted effort.
    fix: |
      For a full node: set node.mode: "full", leave validatorWalletAddress/operatorAddress empty,
      and skip the staking wizard + keystore import entirely. Still configure RPC/WS, the
      consensus address + genesis, and one LLM provider key.
    severity: low

  # ============================================================================
  # UPDATE PROCEDURE
  # ============================================================================

  - id: alloy-stale-bind-mount
    description: "Alloy telemetry container stops sending logs after node restart due to stale bind mount"
    detect: |
      # Check if Alloy is running but seeing old logs
      # 1. Get the last log timestamp Alloy is seeing
      docker exec genlayer-node-alloy ls -la /var/log/genlayer/node.log 2>/dev/null | awk '{print $6, $7, $8}'

      # 2. Compare with actual log file on host
      ls -la /opt/genlayer-node/data/node/logs/node.log 2>/dev/null | awk '{print $6, $7, $8}'

      # If timestamps differ significantly, bind mount is stale

      # 3. Check Grafana Loki for recent logs from this node
      # If no logs in last 5 minutes but node is running, Alloy likely has stale mount
    impact: |
      CRITICAL TELEMETRY FAILURE - NODE APPEARS OFFLINE TO MONITORING

      When the genlayer-node service restarts (during upgrade or otherwise), the bind
      mount inside the Alloy container becomes frozen/stale:

      - Host path: /opt/genlayer-node/data/node/logs/node.log → Current logs
      - Container view: /var/log/genlayer/node.log → Frozen at restart time

      The Alloy container was started with a bind mount that resolved through symlinks.
      When those symlinks change (pointing to new version), Docker doesn't refresh the
      mount. Alloy continues reading the old, stale file.

      CONSEQUENCES:
      - No telemetry sent to Grafana Loki after node restart
      - Node appears offline/dead to monitoring systems
      - Heartbeat service marks validator as IDLE
      - After 3 strikes: validator gets BANNED until next epoch
      - Validator loses rewards and may face penalties
      - Node is actually running and validating correctly (silent failure)

      TIMELINE EXAMPLE:
      - Jan 29 10:25: Node restarted for upgrade
      - Jan 29 10:25: Alloy's bind mount becomes stale (frozen at this timestamp)
      - Jan 29 - Feb 3: No logs sent to Grafana (5 days!)
      - Feb 3: Validator banned for appearing offline
      - Feb 3: Issue discovered, Alloy restarted, logs flow again

      ROOT CAUSE:
      Docker bind mounts are established at container start time and resolve symlinks
      to their target inodes. When symlinks change (e.g., /opt/genlayer-node/data
      switches from ${OLD_VERSION}/data to ${VERSION}/data), the container still sees the old
      directory's inode.
    fix: |
      IMMEDIATE FIX (after node restart):
      =====================================
      Restart the Alloy container to refresh the bind mount:

        docker compose --profile monitoring up -d --no-deps --force-recreate alloy

      Verify logs are flowing:
        docker logs genlayer-node-alloy 2>&1 | tail -5
        # Should show recent log processing activity

      PREVENTIVE FIX (systemd integration):
      =====================================
      The genlayer-node systemd service should include ExecStartPost to automatically
      restart Alloy whenever the node restarts:

        [Service]
        ...
        ExecStartPost=-/bin/sh -c 'sleep 5 && /usr/bin/docker compose --profile monitoring up -d --no-deps --force-recreate alloy 2>/dev/null || true'

      This ensures Alloy's bind mount is refreshed on every node restart.

      DURING UPGRADES:
      ================
      Always restart Alloy after starting the new node version:

        # Phase 2: Quick Switch
        sudo systemctl stop genlayer-node
        # ... update symlinks ...
        sudo systemctl start genlayer-node

        # NEW: Refresh Alloy telemetry
        sleep 5  # Wait for node to initialize
        docker compose --profile monitoring up -d --no-deps --force-recreate alloy

      VERIFICATION:
      =============
      After restarting Alloy, verify telemetry is flowing:

        # Check Alloy sees current logs
        docker exec genlayer-node-alloy ls -la /var/log/genlayer/
        # Timestamp should be recent (within minutes)

        # Check Alloy is processing logs
        docker logs genlayer-node-alloy 2>&1 | grep "tail routine"
        # Should show active tailing

        # Check Grafana for recent logs (if available)
        # Dashboard: https://genlayerfoundation.grafana.net/...
    severity: critical
    when_to_check: |
      MANDATORY CHECKS:
      1. After ANY node restart (upgrade, manual restart, crash recovery)
      2. If validator appears offline in monitoring but node is actually running
      3. If no logs appearing in Grafana Loki for this validator
      4. During post-upgrade verification phase

      SYMPTOMS OF THIS ISSUE:
      - Node health endpoint returns OK (curl localhost:9153/health)
      - Node is syncing and validating (check journalctl logs)
      - But Grafana shows no data / validator appears offline
      - Alloy container is running but log timestamps are old

  - id: high-downtime-update
    description: "Stopping old node before preparing new version causes 3-4 minute downtime"
    detect: |
      # Detect if update procedure stops node before preparation
      # Check if these steps happen in wrong order:
      # 1. systemctl stop (WRONG - should be last)
      # 2. Download new version
      # 3. GenVM setup (~2 minutes)
      # 4. systemctl start
    impact: |
      CRITICAL VALIDATOR IMPACT:
      - 3-4 minutes downtime vs a measured interruption with correct procedure
      - Missed ~12-24 validation opportunities (at 10-20s block times)
      - Lost consensus participation in current epoch
      - Missed rewards from validations during downtime
      - Validator needs to re-prime after reconnecting
      - Potential slashing penalties for extended downtime
    fix: |
      CORRECT UPDATE PROCEDURE (Minimal-Downtime):

      Phase 1: PREPARE WHILE OLD NODE RUNS (No Downtime)
      ===================================================
      1. Download new version to /tmp
      2. Create new version directory
      3. Extract tarball
      4. Run GenVM setup (THIS IS THE SLOW PART - 2+ minutes)
      5. Copy config.yaml and .env
      6. Enable LLM provider in GenVM config if needed
      7. Create data directory and symlinks to shared DB
      8. Copy keystore

      Phase 2: QUICK SWITCH (a measured interruption downtime)
      ==============================================
      1. Stop old node: systemctl stop genlayer-node
      2. Update symlinks (very fast - <1 second)
      3. Start new node: systemctl start genlayer-node

      KEY PRINCIPLE: Never stop old node until new version is 100% ready to start.

      See update-procedure.md for detailed commands.
    severity: critical
    validator_impact: "missed validations, lost rewards, priming delay, potential slashing"

  - id: database-not-shared-patch-versions
    description: "Database handover assumes compatibility from version numbers alone"
    detect: |
      Inspect the configured datadir and resolved mount/symlink paths. Compare
      old and target genesis, AddressManager and supported database migration.
    impact: |
      Reusing old-network state or concurrently writing from two processes can
      invalidate sync assumptions. Docker cannot follow paths outside its mount.
    fix: |
      Preserve the old state. For a new network, use fresh data. For a compatible
      same-network upgrade, stop the old process, take a consistent backup and
      explicitly hand over the real data directory. Never delete another release's
      database or create shared storage automatically. Rollback must use a database
      compatible with the old binary, restoring the backup if necessary.
    severity: critical

  - id: wizard-requires-tty
    description: "Attempting to run staking wizard non-interactively"
    detect: |
      # The wizard uses @inquirer/core which requires TTY input.
      # Any attempt to pipe input or run via remote --command will fail.
      # Check if running in non-interactive context:
      [ -t 0 ] || echo "NOT_INTERACTIVE"
    impact: |
      Wizard crashes with ExitPromptError. No on-chain changes made, but
      wastes time and confuses users who expect automation to work.
    fix: |
      The staking wizard MUST be run in an interactive terminal:
      1. Run directly in a terminal window (not piped)
      2. Do NOT use: echo "yes" | genlayer staking wizard
      3. Do NOT use: ssh host --command="genlayer staking wizard"
      4. Do NOT use: gcloud compute ssh --command="genlayer staking wizard"

      If automation is needed, use individual CLI commands instead:
      - genlayer staking validator-join (non-interactive with all flags)
      See staking-wizard-procedure.md for the full alternative flow.
    severity: medium

  - id: wizard-owner-vs-validator-address
    description: "Confusing the owner address with the validator wallet address"
    detect: |
      # The validator wallet address is a SMART CONTRACT, not the owner account.
      # Common mistake: using owner address in config.yaml instead of validator wallet.
      # Check: validator-info should work with the address in config.yaml
      genlayer staking validator-info --validator <ADDRESS_FROM_CONFIG>
      # If it returns "Address is not a validator", the wrong address is being used.
    impact: |
      Node starts but cannot validate. It won't recognize itself as a validator
      on-chain because the owner address is not a validator wallet contract.
    fix: |
      Use the validatorWallet address from the wizard output, NOT the owner address:

      WRONG (owner address):
        validatorWalletAddress: "0x01959d0ed..." <- This is the owner, not the validator

      CORRECT (validator wallet contract):
        validatorWalletAddress: "0x1451c990fa6..." <- This is the on-chain validator wallet

      To find your validator wallet address:
        genlayer staking validator-info --account "Owner Name"
        # Or check the wizard completion summary output
    severity: critical
    when_to_check: |
      MANDATORY CHECK during config.yaml setup (Step 4):
      - Verify the validatorWalletAddress is the validator wallet contract, not the owner

  - id: wizard-operator-keystore-forgotten
    description: "Export passphrase forgotten or keystore file lost after wizard"
    detect: |
      # Check if keystore file exists at expected location
      ls -la /path/to/operator-keystore.json 2>/dev/null || echo "KEYSTORE_MISSING"
    impact: |
      Cannot import operator key on the validator server.
      Must re-export the keystore with a new passphrase.
    fix: |
      If the operator account still exists in the CLI:
        genlayer account list
        # Find the operator account name
        genlayer account export --account "Operator Name" --output "./new-keystore.json"
        # Set a new export password

      If the operator account was deleted:
        - Create a new operator account
        - Update the validator to use the new operator:
          genlayer staking set-operator \
            --account "Owner Name" \
            --validator 0xVALIDATOR_WALLET \
            --operator 0xNEW_OPERATOR
        - Fund the new operator address with GEN for gas
    severity: high

  - id: wizard-insufficient-balance
    description: "Running wizard without enough GEN tokens"
    detect: |
      genlayer account show
      # Balance must be >= the live self-stake minimum (plus small gas buffer)
    impact: |
      Wizard exits at balance check step. No on-chain changes made.
    fix: |
      1. Check current balance: genlayer account show
      2. Fund account with the live self-stake minimum plus gas
      3. Re-run the wizard
    severity: medium

  - id: wizard-account-locked
    description: "Running wizard with a locked owner account"
    detect: |
      genlayer account list
      # Account must show "(unlocked)" status
    impact: |
      Wizard may fail to sign the staking transaction.
    fix: |
      Unlock before running wizard:
        genlayer account unlock --account "Account Name"
    severity: medium

  - id: operator-unfunded
    description: "Operator account has no GEN for gas fees"
    detect: |
      # Check operator balance (on local machine where CLI is installed)
      genlayer account show --account "Operator Name"
      # Balance should be > 0 GEN
      # On the server, check via RPC or block explorer for the operator address
    impact: |
      Node starts but fails to submit validation transactions. The operator
      signs blocks and submits on-chain transactions, which require gas fees.
      Without funds:
      - Validation transactions fail with insufficient balance errors
      - Validator appears online but misses validation rounds
      - Lost rewards and potential reputation damage
      - May eventually be quarantined for inactivity
    fix: |
      Transfer GEN from the owner account to the operator address:

      1. Check operator balance:
         genlayer account show --account "Operator Name"

      2. If balance is 0 or low, send GEN from owner:
         genlayer account send 0xOPERATOR_ADDRESS 10gen \
           --account "Owner Name" \
           --network testnet-bradbury

      3. Verify operator now has funds:
         genlayer account show --account "Operator Name"

      Recommended: At least 10 GEN for initial funding.
      Monitor and top up when balance drops below 1 GEN.
    severity: critical
    when_to_check: |
      MANDATORY CHECK after staking wizard completes:
      1. Immediately after wizard creates operator account
      2. Before uploading operator keystore to the server
      3. Periodically during node operation (monitor operator balance)

  - id: reused-chain-id
    severity: critical
    detect: "Run scripts/check-network.mjs before staking or startup."
    impact: "Old networks also use chain ID 4221 and can accept transactions on the wrong chain."
    fix: "Require the Phase 2 genesis and contract code; ask the RPC owner to correct routing."

  - id: missing-release
    severity: critical
    detect: "Check exact tarball, checksum and signature URLs before extraction."
    impact: "A preview/changelog may name an unpublished release."
    fix: "Wait for the approved release; do not silently select an older binary or latest tag."

  - id: legacy-cli
    severity: critical
    detect: "Confirm installed CLI/SDK versions and operator-proof registration support."
    impact: "validatorJoin(address) cannot register a Phase 2 validator."
    fix: "Use the qualified v0.40 CLI with the matching SDK; import the operator account for its proof."

  - id: old-chain-state
    severity: critical
    detect: "Compare the existing database's network with the target genesis and registry."
    impact: "Reusing old-network state corrupts synchronization assumptions."
    fix: "Preserve backups and use a fresh data directory for a network migration."

  - id: missing-manifest
    severity: critical
    detect: "Check consensus.chainid, consensus.manifestpath and trusted file provenance."
    impact: "Doctor/startup cannot verify deployed protocol compatibility."
    fix: "Install the approved Phase 2 manifest, never one generated from the untrusted endpoint."

  - id: websocket-key
    severity: high
    detect: "WS handshake returns 401 although HTTP reads work."
    impact: "The node cannot subscribe to chain updates."
    fix: "Provision GENLAYERNODE_ROLLUP_GENLAYERCHAINRPCKEY privately; use X-AccessKey through the supported node configuration."

  - id: public-rpc-quota
    severity: high
    detect: "Read-only probes receive HTTP 429 or RPC rate-limit errors."
    impact: "Parallel reads can fail on an otherwise healthy chain."
    fix: "Pace diagnostic reads and obtain a suitably provisioned assigned endpoint. Do not blindly retry signed submissions."

  - id: wrong-genvm-layout
    severity: high
    detect: "Old third_party/genvm path or GenVM binaries cannot run."
    impact: "Old setup recipes do not initialize the current release."
    fix: "Use Python 3.10+ and opt/genvm/current/bin/setup.py in the final install location. Rerun setup after moving it."

  - id: environment-not-exported
    severity: high
    detect: "Doctor reports missing keys despite a populated environment file."
    impact: "Child processes do not inherit shell-only variables."
    fix: "Export a trusted environment file for manual runs; use EnvironmentFile in systemd. Never print it."

  - id: password-on-command-line
    severity: critical
    detect: "Service or command uses --password or interpolates secret values."
    impact: "Secrets appear in process arguments/history and obsolete flags may fail."
    fix: "Binary uses GENLAYERNODE_PASSWORD; Compose maps NODE_PASSWORD. Keep secrets private."

  - id: compose-paths-and-permissions
    severity: high
    detect: "Relative mounts resolve incorrectly, uid 10001 cannot write data, or --setup tries to modify read-only config."
    impact: "The container cannot initialize or persist node state."
    fix: "Run Compose from the version directory, grant the new data directory to uid 10001, and edit public config on the host."

  - id: provider-disabled
    severity: high
    detect: "An LLM key is present but its provider is disabled in the actual module config."
    impact: "GenVM cannot execute LLM calls."
    fix: "Enable the chosen provider in the release-supported module configuration and rerun doctor."

  - id: webdriver-ssrf
    severity: high
    detect: "GenVM explicitly reports ADDRESS_FORBIDDEN for WebDriver."
    impact: "Web operations fail despite container health."
    fix: "Use the release's supported WebDriver module configuration and diagnose its allowlist; do not disable SSRF checks or invent a fixed subnet."

  - id: operator-mismatch
    severity: critical
    detect: "Imported public address differs from the validator's registered operator."
    impact: "The node cannot perform validator duties."
    fix: "Import the matching key or follow the authorized proof-bound operator rotation; never place the owner key on-server."

  - id: duplicate-operator
    severity: critical
    detect: "Old and new processes share an operator key or writable database."
    impact: "Conflicting submissions and state access can occur."
    fix: "Stop the old process before handing over the key/state."

  - id: epoch-zero-visibility
    severity: high
    detect: "Validator is registered but absent from the active-validator list in epoch 0."
    impact: "Registration may be mistaken for failure or for active participation."
    fix: "Inspect the joined registry, live self-stake minimum and activation/priming state separately. Do not advance epochs."

  - id: missing-clean-host-dependencies
    severity: high
    detect: "Run host-prerequisites.md checks before download, CLI or setup."
    impact: "A developer machine can hide absent curl, cosign, Python venv, libstdc++ or supported Node.js."
    fix: "Install the documented packages for the actual distribution and verify tool versions; do not skip failed checks."

  - id: compose-too-old
    severity: high
    detect: "docker compose version is older than 2.24 or rejects env_file.required."
    impact: "The shipped Compose file cannot be loaded."
    fix: "Install a supported Compose plugin through the approved Docker package repository."

  - id: llm-host-config-not-mounted
    severity: high
    detect: "Docker still uses image defaults after editing host GenVM configuration."
    impact: "The chosen provider or strategy is never applied."
    fix: "Use the explicit read-only LLM module override in common-procedures.md and rerun doctor."
