# Flat layout read by taskfiles/claude/scripts/validate-skill.sh:
# a `validations` list with ids, and a top-level `on_stop` list of ids.
#
# Not automated (they need a real operator name / validator address):
#   - operators-funded:  genlayer account show --account '<operator-name>'
#                        -> balance matches the funded amount
#   - identity-set:      genlayer staking validator-info <validator-address>
#                        -> identity.moniker is present and correct
validations:
  - id: cli-installed
    name: genlayer CLI is installed
    type: command
    command: "genlayer --version"
    expect: "exit 0"
    message: "genlayer CLI not found. Install it with: npm install -g genlayer"

  - id: accounts-exist
    name: At least one owner account exists
    type: command
    command: "genlayer account list"
    expect: "exit 0"
    message: "No usable accounts. Create or import one with: genlayer account create"

  - id: correct-network
    name: A network is active (marked with *)
    type: command
    command: "genlayer network list | grep -q '[*]'"
    expect: "exit 0"
    message: "No active network. Select the target with: genlayer network set"

  - id: validators-visible
    name: Validators are visible in the validator set
    type: command
    command: "genlayer staking validators"
    expect: "exit 0"
    message: "Could not list validators on the active network."

  - id: memory-updated
    name: validators.md exists and is not empty
    type: command
    command: "[ -s validators.md ]"
    expect: "exit 0"
    message: "validators.md is missing or empty. Record new validators and operators there."

on_stop:
  - cli-installed
  - accounts-exist
  - correct-network
  - validators-visible

on_warn:
  - memory-updated
